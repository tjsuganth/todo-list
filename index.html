<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Pulse - Premium Gradient To-Do App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Ambient background gradient spheres -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="app-card">
        <!-- Header & Progress -->
        <header class="app-header">
            <div class="header-title-row">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                    </div>
                    <h1>Task Pulse</h1>
                </div>
                <span id="dateBadge" class="date-badge">Today</span>
            </div>

            <!-- Completion Progress Bar -->
            <div class="progress-section">
                <div class="progress-info">
                    <span class="progress-label">Completion Status</span>
                    <span id="progressPercent" class="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
            </div>
        </header>

        <!-- Task Input Controls -->
        <section class="input-section">
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">

                <select id="prioritySelect" class="priority-select" title="Task Priority / Grading">
                    <option value="high">🔥 High</option>
                    <option value="medium" selected>⚡ Medium</option>
                    <option value="low">🌱 Low</option>
                </select>

                <button id="addTaskBtn" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Task</span>
                </button>
            </div>
            <div id="inputError" class="input-error" hidden>Please enter a task description</div>
        </section>

        <!-- Filters & Search Toolbar -->
        <section class="toolbar-section">
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Filter tasks..." autocomplete="off">
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All <span id="countAll"
                        class="badge">0</span></button>
                <button class="filter-btn" data-filter="active">Active <span id="countActive"
                        class="badge">0</span></button>
                <button class="filter-btn" data-filter="completed">Done <span id="countCompleted"
                        class="badge">0</span></button>
            </div>
        </section>

        <!-- Task List Container -->
        <main class="list-container">
            <ul id="taskList" class="task-list">
                <!-- Dynamic tasks rendered here -->
            </ul>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                </div>
                <h3>All clear!</h3>
                <p>No tasks found. Add a task above to get started.</p>
            </div>
        </main>

        <!-- Footer Stats & Actions -->
        <footer class="app-footer">
            <span id="statsSummary" class="stats-text">0 items remaining</span>
            <button id="clearCompletedBtn" class="btn-text">Clear Completed</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
